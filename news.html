<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Channel</title>
    <link rel="stylesheet" href="news.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Custom Hand Cursor Element -->
    <div id="customCursor" class="custom-cursor">
        <div class="cursor-pointer-icon"></div>
    </div>

    <div class="news-screen-container">
        
        <!-- Top Header Section -->
        <div class="news-top-header">
            <div class="banner">
                Professional
            </div>
            <div class="channel-label">News Channel</div>
        </div>

        <!-- Main Section Selection Area -->
        <div class="news-content-area">
            <div class="section-heading">Select a Section</div>
        <div class="news-sections-list">
            <div class="news-row-btn" onclick="openNewsSection('Courses Taught', '<strong>DMD220 Interface Design</strong><br>Covers the fundamentals of user interface design, layout principles, and interactive prototypes.<br><br><strong>DMD230 Personal Branding</strong><br>Focuses on building professional digital identities, portfolios, and marketing strategies.<br><br><strong>DMD210 Vector Illustration</strong><br>Explores digital art creation, vector graphics, and asset generation techniques.<br><br><strong>GAA105 Game Art and Animation Fundamentals</strong><br>Introduces the core concepts of 2D game art pipelines and animation principles.')">
        Courses Taught
     </div>
            <div class="news-row-btn" onclick="openNewsSection('Course Evaluations', [
        'EOC_2025_Page_1.jpg', 
        'EOC_2025_Page_2.jpg', 
        'EOC_2026_2_Page_1.jpg', 
        'EOC_2026_2_Page_2.jpg', 
        'EOC_2026_2_Page_3.jpg', 
        'EOC_2026_2_Page_4.jpg', 
        'EOC_2026_3_Page_1.jpg', 
        'EOC_2026_3_Page_2.jpg', 
        'EOC_2026_Page_1.jpg', 
        'EOC_2026_Page_2.jpg',
        'EOC_2026_Page_3.jpg',
        ])">
        Course Evaluations
        </div>
        <div class="news-row-btn" onclick="openNewsSection('Student Work', [
                'DMD210_1.png',
                'DMD230_1.png',
                'GAA105_1.png'
            ])">
        Student Work
        </div>
        <div class="news-row-btn" onclick="openNewsSection('Future Courses', 'ART103 Digital Asset Creation, ART112 Graphic Design Principles, DMD150 Digital Tools for Media and Design, DMD235 Marketing for Digital Media, DMD305 Advanced Digital Creation, DMD410 Media and Content Accessibility, ART209 Typography, MKT430 Professional Ad Creation for Industry')">
        Future Courses
        </div>
        </div>
        </div>

        <!-- Bottom Wii Menu Toolbar -->
        <div class="news-bottom-bar" onclick="window.location.href='index.html'">
            <span class="wii-menu-text">Menu</span>
        </div>
    </div>

<!-- News Modal Popup -->
    <div id="newsModal" class="news-modal-overlay" style="display: none;">
        <div class="news-modal-content">
            <button class="news-modal-close" onclick="closeNewsModal()">×</button>
            <h3 id="newsModalTitle" class="news-modal-title"></h3>
            <p id="newsModalDesc" class="news-modal-desc"></p>
        </div>
    </div>

    <!-- NEW: Detailed Image Lightbox Modal -->
    <div id="eocDetailLightbox" class="news-modal-overlay" style="display: none; z-index: 3000;">
        <div class="news-modal-content" style="width: 850px; max-width: 95vw; max-height: 90vh;">
            <button class="news-modal-close" onclick="closeEocDetail()">×</button>
            <h3 class="news-modal-title">Course Evaluation - Detailed View</h3>
            <img id="eocDetailImg" src="" alt="Detailed View" style="width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; background: #fff; border: 2px solid #f0cce2;">
        </div>
    </div>

    <script src="news.js"></script>
</body>
</html>
